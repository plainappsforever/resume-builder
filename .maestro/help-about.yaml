# P6 (F11, F12, SPEC §11): Help (verbs, matching, checks, the evidence notes and "What ATS means" — information only) and
# About and privacy (no-network statement, placeholder policy address, licences). Precondition: empty app.
appId: ${APP_ID}
---
- runFlow: subflows/reset.yaml
- tapOn:
    id: tab-settings
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: settings-help
- tapOn:
    id: settings-help
- extendedWaitUntil:
    visible:
      id: help-screen
    timeout: 15000
- tapOn:
    id: help-verbs
- extendedWaitUntil:
    visible:
      id: verbs-count
    timeout: 15000
- assertVisible:
    id: verbs-lead
- tapOn:
    id: verbs-language-de
- assertVisible:
    id: verbs-count
    text: "\\d+ words"
- runFlow: subflows/back.yaml
- tapOn:
    id: help-matching
- extendedWaitUntil:
    visible:
      id: help-matching-p5
    timeout: 15000
- assertVisible: ".*There is no score and no percentage.*"
- runFlow: subflows/back.yaml
- tapOn:
    id: help-checks
- extendedWaitUntil:
    visible:
      id: help-check-C1
    timeout: 15000
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: help-check-C15
- runFlow: subflows/back.yaml
- tapOn:
    id: help-evidence
- extendedWaitUntil:
    visible:
      id: evidence-greenhouse
    timeout: 15000
- assertVisible: ".*2\\.5 MB.*"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: evidence-unknown
- runFlow: subflows/back.yaml
- tapOn:
    id: help-ats
- extendedWaitUntil:
    visible:
      id: help-ats-p1
    timeout: 15000
- assertVisible: "ATS stands for applicant tracking system.*"
- assertNotVisible: ".*ATS score.*"
- runFlow: subflows/back.yaml
- tapOn:
    id: help-examples
- extendedWaitUntil:
    visible:
      id: examples-role-warehouse
    timeout: 15000
- runFlow: subflows/back.yaml
- runFlow: subflows/back.yaml
# About and privacy
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: settings-about
- tapOn:
    id: settings-about
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 15000
- assertVisible:
    id: about-privacy-network
    text: "The app has no network code.*"
- runFlow:
    file: subflows/scroll-to.yaml
    env:
      TARGET: about-privacy-url
- assertVisible:
    id: about-privacy-url
    text: "https://plainapps.dfdsfdsfsdf.workers.dev/apps/resume-builder/privacy"
- runFlow:
    file: subflows/scroll-center.yaml
    env:
      TARGET: licence-pdfjs-dist
- assertVisible: ".*Apache-2.0.*"
