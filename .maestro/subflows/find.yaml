# Finds env TARGET (an id) in a long list whose order is not known: look down first, then up.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: DOWN
          timeout: 15000
          speed: 70
          optional: true
- runFlow:
    when:
      notVisible:
        id: ${TARGET}
    commands:
      - scrollUntilVisible:
          element:
            id: ${TARGET}
          direction: UP
          timeout: 30000
          speed: 70
- waitForAnimationToEnd
