# P3.5/P4 device check: the keyword engine's oracle vectors + the JS language features it relies on, run on the phone's
# Hermes (dev route debug/hermes). Must show "HERMES PASS" (0 mismatches against the Node/Python vectors).
appId: ${APP_ID}
---
- runFlow: subflows/reset.yaml
- tapOn:
    id: tab-settings
- runFlow:
    file: subflows/scroll-center.yaml
    env:
      TARGET: debug-hermes
- tapOn:
    id: debug-hermes
- extendedWaitUntil:
    visible: "HERMES PASS"
    timeout: 60000
