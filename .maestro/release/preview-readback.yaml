# P6 (A13): against a RELEASE build (scripts/e2e.sh <platform> preview .maestro/release/preview-readback.yaml): no dev links, no
# Metro, no INTERNET permission on Android — the example loads from the welcome screen, a PDF is made and read back with
# pdf.js in the app's WebView, and the result says every word came back in the right order. Precondition: a fresh install.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: look-at-example
    timeout: 90000
- tapOn:
    id: look-at-example
- extendedWaitUntil:
    visible:
      id: version-card-1
    timeout: 40000
- tapOn:
    id: version-card-1
- extendedWaitUntil:
    visible:
      id: version-screen
    timeout: 15000
- tapOn:
    id: version-tabs-export
- extendedWaitUntil:
    visible:
      id: export-share
    timeout: 15000
- tapOn:
    id: export-share
- runFlow:
    file: ../subflows/dismiss-share.yaml
    env:
      WHAT: PDF Document
- extendedWaitUntil:
    visible:
      id: readback-headline
    timeout: 30000
- assertVisible:
    id: readback-headline
    text: "Read back with pdf.js 6.3.289: \\d+ of \\d+ words, all \\d+ lines in the right order, 1 page, \\d+ KB\\."
- assertNotVisible:
    id: export-debug
