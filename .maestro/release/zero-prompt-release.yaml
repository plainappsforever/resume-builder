# P6 (A11, A13, rule 15): against a RELEASE build (scripts/e2e.sh <platform> preview .maestro/release/zero-prompt-release.yaml):
# a fresh install shows no dialog, no permission prompt, no onboarding — only the two choices — and Settings has no debug
# controls. (The development flow zero-prompt.yaml resets through a dev link, which release builds do not have.)
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
    clearState: true
- extendedWaitUntil:
    visible:
      id: start-profile
    timeout: 90000
- assertVisible:
    id: look-at-example
- assertNotVisible: "Allow"
- assertNotVisible: "Don’t Allow"
- assertNotVisible: "Would Like to"
- assertNotVisible: "Next"
- assertNotVisible: "Skip"
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-screen
- runFlow:
    file: ../subflows/scroll-to.yaml
    env:
      TARGET: settings-about
- assertNotVisible:
    id: debug-reset
- assertNotVisible:
    id: debug-pdf-gate
- tapOn:
    id: settings-about
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 15000
- assertVisible:
    id: about-privacy-network
