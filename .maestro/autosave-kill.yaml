# A12: an edit survives the app being killed right after it (no Save button anywhere). Precondition: empty app.
appId: ${APP_ID}
---
- runFlow: subflows/reset.yaml
- tapOn:
    id: start-profile
- tapOn:
    id: profile-name
- inputText: Kim Park
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-profile
    timeout: 90000
- tapOn:
    id: tab-profile
- assertVisible: "Kim Park"
